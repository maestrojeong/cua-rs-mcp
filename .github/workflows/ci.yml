name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS runners only: every crate here links AppKit, ApplicationServices and
  # ScreenCaptureKit, so a Linux job could not even typecheck.
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      # CI has neither the Accessibility nor the Screen Recording grant, so only
      # the permission-free logic is exercised here: tree rendering, app-name
      # resolution tiers, window matching, image clamping. Anything that touches
      # a live UI is verified by hand against the checklist in DESIGN.md.
      - name: Test
        run: cargo test --workspace

      - name: Smoke test the MCP handshake
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/release/cua-rs > out.json
          grep -q '"name":"get_app_state"' out.json
          grep -q '"name":"check_permissions"' out.json
          echo "handshake ok"
