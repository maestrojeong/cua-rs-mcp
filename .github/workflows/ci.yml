name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS runners only: every crate here links AppKit, ApplicationServices and
  # ScreenCaptureKit, so a Linux job could not even typecheck.
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      # Runs BEFORE the workspace commands, and with a target dir of its own per
      # crate, because a workspace build is exactly what hides this class of bug.
      # Cargo unifies features across the whole graph, so a crate that uses an
      # optional dependency feature without declaring it still compiles as long as
      # some sibling asks for the same feature. `cua-overlay` shipped that way in
      # 0.4.2 through 0.5.0: it called `NSRunningApplication::processIdentifier`,
      # which objc2-app-kit gates on "libc", while only cua-core and cua-hid
      # declared it. Every workspace build passed and `cargo build -p cua-overlay`
      # did not. A separate CARGO_TARGET_DIR matters as much as the `-p`: sharing
      # one lets an earlier unified build leave usable artifacts behind.
      - name: Each crate builds on its own features
        run: |
          for crate in cua-ax cua-capture cua-hid cua-core cua-mcp cua-overlay; do
            echo "::group::$crate"
            CARGO_TARGET_DIR="target/isolated/$crate" cargo build -p "$crate"
            echo "::endgroup::"
          done

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      # CI has neither the Accessibility nor the Screen Recording grant, so only
      # the permission-free logic is exercised here. Unit tests cover tree
      # rendering, app-name resolution tiers, window matching, image clamping and
      # chord parsing; crates/cua-mcp/tests/mcp_surface.rs drives the real binary
      # over stdio and pins the advertised tool surface plus the HID refusal,
      # both of which are reachable without any grant. Anything that touches a
      # live UI is verified by hand against the checklist in DESIGN.md.
      - name: Test
        run: cargo test --workspace

      # The release binary is built above but `cargo test` exercises the debug
      # one, so confirm the shipped artifact starts and answers at all. The
      # surface itself is asserted properly by mcp_surface.rs.
      - name: Release binary runs
        run: |
          ./target/release/cua-rs --version
          ./target/release/cua-rs permissions
