name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS runners only: every crate here links AppKit, ApplicationServices and
  # ScreenCaptureKit, so a Linux job could not even typecheck.
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      # `crates/` and the workspace member list must agree in both directions.
      # A directory under `crates/` that is not a member is invisible to every
      # other step here — nothing builds it, nothing lints it, nothing tests it —
      # so it can sit in the tree indefinitely looking like a crate. That
      # happened: `crates/cua-sky/examples/` was left behind by an abandoned
      # experiment and no command in this file had any reason to mention it. The
      # other direction is the ordinary typo, a member whose directory is gone.
      - name: crates/ and the workspace member list agree
        run: |
          members=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print("\n".join(sorted(p["name"] for p in json.load(sys.stdin)["packages"])))')
          dirs=$(ls -1 crates | sort)
          if [ "$members" != "$dirs" ]; then
            echo "crates/ and the workspace members disagree:"
            diff <(echo "$members") <(echo "$dirs") || true
            echo "Left is a workspace member; right is a directory under crates/."
            exit 1
          fi
          echo "CRATES=$(echo $members)" >> "$GITHUB_ENV"

      # Runs BEFORE the workspace commands, and with a target dir of its own per
      # crate, because a workspace build is exactly what hides this class of bug.
      # Cargo unifies features across the whole graph, so a crate that uses an
      # optional dependency feature without declaring it still compiles as long as
      # some sibling asks for the same feature. `cua-overlay` shipped that way in
      # 0.4.2 through 0.5.0: it called `NSRunningApplication::processIdentifier`,
      # which objc2-app-kit gates on "libc", while only cua-core and cua-hid
      # declared it. Every workspace build passed and `cargo build -p cua-overlay`
      # did not. A separate CARGO_TARGET_DIR matters as much as the `-p`: sharing
      # one lets an earlier unified build leave usable artifacts behind.
      #
      # The list comes from the step above rather than being written out here, so
      # a new crate cannot be added to the workspace and silently skip this check.
      - name: Each crate builds on its own features
        run: |
          for crate in $CRATES; do
            echo "::group::$crate"
            CARGO_TARGET_DIR="target/isolated/$crate" cargo build -p "$crate"
            echo "::endgroup::"
          done

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      # CI has neither the Accessibility nor the Screen Recording grant, so only
      # the permission-free logic is exercised here. Unit tests cover tree
      # rendering, app-name resolution tiers, window matching, image clamping and
      # chord parsing; crates/cua-mcp/tests/mcp_surface.rs drives the real binary
      # over stdio and pins the advertised tool surface plus the HID refusal,
      # both of which are reachable without any grant. Anything that touches a
      # live UI is verified by hand against the checklist in DESIGN.md.
      - name: Test
        run: cargo test --workspace

      # The release binary is built above but `cargo test` exercises the debug
      # one, so confirm the shipped artifact starts and answers at all. The
      # surface itself is asserted properly by mcp_surface.rs.
      - name: Release binary runs
        run: |
          ./target/release/cua-rs --version
          ./target/release/cua-rs permissions

  # The Linux backend (crates/cua-ax-linux), DESIGN.md §15. The job above is
  # macOS-only because cua-ax, cua-capture, cua-hid and cua-overlay are macOS FFI
  # crates; they are not built here. Only the crates that target Linux are:
  # cua-core (the platform-neutral half), cua-ax-linux, and cua-mcp, which picks
  # the Linux backend at compile time. `--lib --bins --tests` skips cua-core's
  # examples, which are macOS probes.
  #
  # The tests run inside a real D-Bus session with the AT-SPI bus up and an
  # Xvfb display, so mcp_surface.rs drives the actual binary against a live
  # registry: check_permissions must find both, list_apps must succeed, and the
  # unsupported tools must refuse with PLATFORM_NOT_SUPPORTED wording rather
  # than no-op. No app is driven here; DESIGN.md §15 lists what was measured by
  # hand.
  linux:
    runs-on: ubuntu-latest
    env:
      CRATES: -p cua-core -p cua-ax-linux -p cua-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y at-spi2-core dbus dbus-x11 xvfb xauth

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Each Linux crate builds on its own features
        run: |
          for crate in cua-core cua-ax-linux cua-mcp; do
            echo "::group::$crate"
            CARGO_TARGET_DIR="target/isolated/$crate" cargo build -p "$crate"
            echo "::endgroup::"
          done

      - name: clippy
        run: cargo clippy $CRATES --lib --bins --tests -- -D warnings

      - name: Build
        run: cargo build --release -p cua-mcp

      - name: Test (D-Bus session + AT-SPI bus + Xvfb)
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            /usr/libexec/at-spi-bus-launcher --launch-immediately &
            sleep 1
            cargo test $CRATES --lib --bins --tests
          '

      - name: Release binary runs
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            /usr/libexec/at-spi-bus-launcher --launch-immediately &
            sleep 1
            ./target/release/cua-rs --version
            ./target/release/cua-rs permissions
          '
