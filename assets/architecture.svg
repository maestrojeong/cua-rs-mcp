<svg width="920" height="420" viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="agentLane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dde9ff"/>
    </linearGradient>
    <linearGradient id="humanLane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e8"/>
      <stop offset="100%" stop-color="#ffe6d1"/>
    </linearGradient>
    <linearGradient id="agentNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b6dff"/>
      <stop offset="100%" stop-color="#5b8bff"/>
    </linearGradient>
    <linearGradient id="humanNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffab5f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a2440" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6dff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a3f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="420" rx="22" fill="#f7f9fc"/>

  <!-- Agent lane -->
  <rect x="24" y="24" width="872" height="176" rx="18" fill="url(#agentLane)" stroke="#c3d4ff" stroke-width="1.5"/>
  <text x="48" y="56" font-size="16" font-weight="700" fill="#1f3d99">Agent's lane</text>
  <text x="48" y="78" font-size="12.5" fill="#4a63a8">no cursor, no keyboard focus</text>

  <!-- Agent node -->
  <rect x="52" y="108" width="118" height="56" rx="14" fill="url(#agentNode)" filter="url(#softShadow)"/>
  <text x="111" y="132" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text>
  <text x="111" y="150" font-size="11" fill="#dce6ff" text-anchor="middle">Claude / Codex</text>

  <!-- arrow: agent -> cua-rs -->
  <path d="M170 136 H 258" stroke="#5b7fd6" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="214" y="124" font-size="11" fill="#3b5bb0" text-anchor="middle">MCP</text>

  <!-- cua-rs node -->
  <rect x="262" y="100" width="140" height="72" rx="14" fill="#ffffff" stroke="#3b6dff" stroke-width="2" filter="url(#softShadow)"/>
  <text x="332" y="132" font-size="15" font-weight="700" fill="#1f3d99" text-anchor="middle">cua-rs</text>
  <text x="332" y="150" font-size="10.5" fill="#4a63a8" text-anchor="middle">Accessibility API</text>
  <text x="332" y="163" font-size="10.5" fill="#4a63a8" text-anchor="middle">addresses an element</text>

  <!-- arrow: cua-rs -> target app -->
  <path d="M402 136 H 560" stroke="#5b7fd6" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="481" y="124" font-size="11" fill="#3b5bb0" text-anchor="middle">AX lookup, pid-routed</text>

  <!-- target app node -->
  <rect x="564" y="96" width="300" height="80" rx="14" fill="#ffffff" stroke="#8fa6e8" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#softShadow)"/>
  <text x="714" y="126" font-size="14" font-weight="700" fill="#1f3d99" text-anchor="middle">Target app (background window)</text>
  <text x="714" y="146" font-size="11" fill="#5670b8" text-anchor="middle">e.g. Notes, a messaging app — doesn't need to be frontmost</text>
  <text x="714" y="164" font-size="11" fill="#5670b8" text-anchor="middle">your mouse and keyboard stay untouched</text>

  <!-- Human lane -->
  <rect x="24" y="220" width="872" height="176" rx="18" fill="url(#humanLane)" stroke="#ffd2ab" stroke-width="1.5"/>
  <text x="48" y="252" font-size="16" font-weight="700" fill="#a34d00">Your lane</text>
  <text x="48" y="274" font-size="12.5" fill="#a3712f">untouched — nothing is taken from you</text>

  <!-- Human node -->
  <rect x="52" y="304" width="118" height="56" rx="14" fill="url(#humanNode)" filter="url(#softShadow)"/>
  <text x="111" y="328" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">You</text>
  <text x="111" y="346" font-size="11" fill="#fff0e2" text-anchor="middle">a real person</text>

  <!-- arrow: you -> foreground window -->
  <path d="M170 332 H 560" stroke="#e08a3f" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="365" y="320" font-size="11" fill="#a3591a" text-anchor="middle">real mouse + keyboard</text>

  <!-- foreground window node -->
  <rect x="564" y="292" width="300" height="80" rx="14" fill="#ffffff" stroke="#ffb066" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="714" y="322" font-size="14" font-weight="700" fill="#a34d00" text-anchor="middle">Whatever you're in, frontmost</text>
  <text x="714" y="342" font-size="11" fill="#a3712f" text-anchor="middle">writing a doc, chatting — the app you're actually using</text>
  <text x="714" y="360" font-size="11" fill="#a3712f" text-anchor="middle">focus always stays right here</text>

  <!-- divider between the two lanes, deliberately no arrow across -->
  <line x1="24" y1="210" x2="896" y2="210" stroke="#c9cfdc" stroke-width="1.5" stroke-dasharray="2 6"/>
  <rect x="360" y="192" width="200" height="36" rx="18" fill="#ffffff" stroke="#c9cfdc" stroke-width="1.5"/>
  <text x="460" y="215" font-size="11.5" font-weight="700" fill="#5b6478" text-anchor="middle">no arrow crosses between the lanes</text>
</svg>
