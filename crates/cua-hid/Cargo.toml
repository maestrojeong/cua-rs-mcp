[package]
name = "cua-hid"
description = "Opt-in HID event synthesis for cua-rs. The only crate here that can move the cursor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
    "CGError",
    "CGGeometry",
] }

objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "NSEvent",
    "NSGraphicsContext",
    "NSResponder",
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSString",
    "NSThread",
] }

[dev-dependencies]
cua-capture.workspace = true
cua-ax.workspace = true
