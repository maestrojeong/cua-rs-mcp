[package]
name = "cua-hid"
description = "Opt-in HID event synthesis for cua-rs. The only crate here that can move the cursor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
    "CGError",
    "CGGeometry",
] }
