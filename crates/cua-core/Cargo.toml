[package]
name = "cua-core"
description = "Snapshot model, app resolution and stable element handles for cua-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cua-ax.workspace = true
cua-capture.workspace = true
cua-hid.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
serde.workspace = true
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
# `CGSession` only, and deliberately nothing else: the session dictionary that
# reports a locked screen is a state read, not an event API. `cua-hid` is the one
# crate in this workspace that links the event surface at all, which is what makes
# "only cua-hid can touch input" checkable from these files rather than a promise
# about code somebody has to go and read. The listen-only input tap behind
# CUA_YIELD_TO_HUMAN used to live here and was moved to `cua-hid::humanwatch` to
# keep that true; `safety.rs` holds the policy and calls into it.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CGSession",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
] }
