[package]
name = "cua-core"
description = "Snapshot model, app resolution and stable element handles for cua-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cua-ax.workspace = true
cua-capture.workspace = true
cua-hid.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
serde.workspace = true
base64.workspace = true
objc2 = { workspace = true }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
# Read-only. `cua-core` links CGEvent for exactly two things: the session
# dictionary that reports a locked screen, and a listen-only input tap that
# returns every event unchanged. It constructs no event and posts none —
# `cua-hid` is still the only crate in this workspace that synthesizes input,
# and `grep -r CGEventCreate crates/cua-core` is how a reader checks that.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CGEvent",
    "CGEventTypes",
    "CGSession",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
] }
